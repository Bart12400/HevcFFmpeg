name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Build with Gradle
      run: |
        ./gradlew assembleDebug --no-daemon > build.log 2>&1 || (
          echo "=== KLUCZOWY BŁĄD COMPILACJI ==="
          grep -iE "error:|exception|failed|e:" build.log | tail -n 25
          exit 1
        )

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: HevcFFmpeg-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
